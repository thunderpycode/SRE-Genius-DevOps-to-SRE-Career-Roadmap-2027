<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">SRE Roadmap 2027</title>
  <desc id="desc">A roadmap infographic for Site Reliability Engineer progression from networking fundamentals to AI tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#142538"/>
      <stop offset="100%" stop-color="#1d3049"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffca45"/>
      <stop offset="100%" stop-color="#f5a500"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0d1728" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>

  <g filter="url(#softShadow)">
