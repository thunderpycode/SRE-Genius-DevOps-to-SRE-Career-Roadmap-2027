      <text x="120" y="44" font-size="24" font-weight="800" fill="#1d2c3f">Networking Fundamentals</text>
      <text x="120" y="78" font-size="20" font-weight="600" fill="#1d2c3f">OSI Model, DNS, TCP/IP,</text>
      <text x="120" y="102" font-size="20" font-weight="600" fill="#1d2c3f">Subnetting, Firewalls</text>
      <text x="447" y="60" font-size="38">🖧</text>
