    <text x="70" y="68" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800" fill="#f3f5f9">SRE (Site Reliability Engineer) Roadmap</text>
    <rect x="1020" y="26" width="110" height="52" rx="14" fill="#eb8d2d"/>
    <text x="1055" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#ffffff">SRE</text>
    <text x="1042" y="83" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffd47d">GENIUS</text>
  </g>

  <text x="600" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="900" fill="url(#gold)" letter-spacing="-3">2027</text>

  <text x="600" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#f1f5fb">
    <tspan>Become a </tspan>
    <tspan fill="#f5b633">Senior SRE:</tspan>
    <tspan> The Practical Path to Success</tspan>
  </text>

